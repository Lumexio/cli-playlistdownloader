name: Bug report
description: Report a reproducible CLI, Electron, or download problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Electron GUI
        - CLI
        - Shared download engine
        - Packaging or installation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a non-private example URL when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and app version
      placeholder: Ubuntu 24.04, AppImage 1.0.0
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove tokens, account data, private playlist URLs, and filesystem personal information.
  - type: checkboxes
    id: security
    attributes:
      label: Security and privacy checks
      options:
        - label: I did not include secrets, auth tokens, or private user data.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
